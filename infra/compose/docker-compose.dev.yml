# Local development dependencies. The API and web client run on the host via
# `pnpm dev` so that hot reload stays fast; only the backing services live here.
name: managedops-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: managedops
      POSTGRES_PASSWORD: managedops
      POSTGRES_DB: managedops
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U managedops -d managedops']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for S3. The console is on :9001 (managedops / managedops-secret).
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: managedops
      MINIO_ROOT_PASSWORD: managedops-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 managedops managedops-secret &&
      mc mb --ignore-existing local/managedops-dev &&
      mc anonymous set none local/managedops-dev
      "

  # Catches every outbound email. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres-data:
  minio-data:
