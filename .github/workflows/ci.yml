name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Integration tests run against a real PostgreSQL, because the invariants
    # they cover — the one-punch-per-day unique index, referential integrity,
    # transaction boundaries — do not exist against a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: managedops
          POSTGRES_PASSWORD: managedops
          POSTGRES_DB: managedops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U managedops -d managedops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://managedops:managedops@localhost:5432/managedops_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @managedops/shared build

      - name: Generate Prisma client
        run: pnpm --filter @managedops/api exec prisma generate

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,json,md,yml,yaml}"

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply migrations
        run: pnpm --filter @managedops/api exec prisma migrate deploy

      - name: Test shared contracts
        run: pnpm --filter @managedops/shared test

      - name: Test API
        run: pnpm --filter @managedops/api test

      - name: Build both applications
        run: pnpm --filter @managedops/api build && pnpm --filter @managedops/web build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25

    # The same real PostgreSQL: the E2E suite drives the whole chain — cookie,
    # CSRF, guard, query scope, render — and a mocked API would exercise none
    # of it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: managedops
          POSTGRES_PASSWORD: managedops
          POSTGRES_DB: managedops_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U managedops -d managedops_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://managedops:managedops@localhost:5432/managedops_e2e?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      SEED_PASSWORD: ManagedOps!2026
      WEB_BASE_URL: http://127.0.0.1:5173
      CORS_ORIGINS: http://127.0.0.1:5173
      E2E_BASE_URL: http://127.0.0.1:5173
      NODE_ENV: production
      TZ: Asia/Kolkata

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build everything
        run: |
          pnpm --filter @managedops/shared build
          pnpm --filter @managedops/api exec prisma generate
          pnpm --filter @managedops/api build
          pnpm --filter @managedops/web build

      - name: Prepare the database
        run: |
          pnpm --filter @managedops/api exec prisma migrate deploy
          pnpm --filter @managedops/api exec tsx prisma/seed.ts

      - name: Start the stack
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          pnpm --filter @managedops/web exec vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &
          # Poll rather than sleep: a fixed wait is either wasted time or a
          # flake, depending on how loaded the runner is.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ >/dev/null &&             curl -so /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json'               -d '{}' http://127.0.0.1:4000/api/v1/auth/login | grep -q '4' && exit 0
            sleep 1
          done
          echo "the stack did not come up"; cat /tmp/api.log /tmp/web.log; exit 1

      - name: Run the browser suite
        run: pnpm test:e2e

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            e2e/playwright-report/
          retention-days: 7

      - name: Server logs on failure
        if: failure()
        run: tail -100 /tmp/api.log /tmp/web.log

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [verify, browser]
    # Only publish from main; a pull request proves the images build without
    # pushing anything.
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
